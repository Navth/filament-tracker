{% extends "base.html" %}
{% block content %}
<h1>Verify login</h1>
<div class="card">
  <p>Bambu sent a 6-digit code to <b>{{ email }}</b>. Check your inbox (and spam).</p>
  <form method="post" action="{{ url_for('bambu_verify') }}">
    <label>Verification code</label>
    <input name="code" pattern="\d{6}" maxlength="6" autofocus required style="max-width:160px;font-size:22px;letter-spacing:6px">
    <div style="margin-top:14px"><button>Verify & log in</button></div>
  </form>
</div>
{% endblock %}
