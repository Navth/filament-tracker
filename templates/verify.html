{% extends "base.html" %}
{% block content %}
<h1>Verify login</h1>
<div class="card" style="max-width:480px">
  <p>Bambu sent a 6-digit code to <b>{{ email }}</b>. Check your inbox (and spam).</p>
  <form method="post" action="{{ url_for('bambu_verify') }}">
    <label>Verification code</label>
    <input name="code" pattern="\d{6}" maxlength="6" autofocus required
           style="max-width:180px;font-size:24px;letter-spacing:8px;text-align:center">
    <div class="actions"><button>Verify & log in</button></div>
  </form>
</div>
{% endblock %}
