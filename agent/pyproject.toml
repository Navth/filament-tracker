[project]
name = "filament-agent"
version = "0.1.0"
description = "Chat-ops agent for Filament Tracker: LangGraph + Gemini or Claude + an MCP server over your spools and prints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic[mcp]>=1.15",
    "google-genai>=2.31",
    "mcp>=2.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.10",
    "httpx>=0.28",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]
# Postgres checkpoints for `ft-agent serve` (set FT_AGENT_DATABASE_URL)
postgres = ["langgraph-checkpoint-postgres>=3.1", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[project.scripts]
ft-agent = "filament_agent.cli:main"
ft-mcp = "filament_agent.mcp_server:main"
ft-evals = "filament_agent.evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filament_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
